# Release pipeline for Ekorbia.
#
# Fires when a tag matching `v*` is pushed (e.g. `v0.8.0`, `v0.8.1`).
# Builds the macOS bundle and publishes one GitHub Release with the
# assets attached:
#
#   • macOS — .dmg (aarch64-apple-darwin, unsigned) + SHA256SUMS.txt
#
# Windows and Linux installers ended with 0.7.1 (the owner only tests and
# runs on a Mac); the old assets stay on their release pages.
#
# Pipeline shape:
#
#   1. create-release  — extracts CHANGELOG notes, creates a DRAFT
#                        GitHub Release for the tag, outputs its id.
#   2. build           — `cargo tauri build` via tauri-action on a macOS
#                        runner, uploads the bundle to the draft release.
#   3. publish-release — downloads the uploaded assets, generates
#                        SHA256SUMS.txt, uploads the sums file, then
#                        flips the draft to published.
#
# Manual release recipe:
#   1. Edit CHANGELOG.md — move [Unreleased] content into a new
#      [0.x.y] section dated today.
#   2. Bump version in src-tauri/Cargo.toml, src-tauri/tauri.conf.json
#      (keep them in sync).
#   3. git commit -am "Prep 0.x.y release"
#   4. git tag v0.x.y
#   5. git push origin main && git push origin v0.x.y
#
# About 20 minutes later, github.com/ekorbia/ekorbia-desktop/releases
# gets a new published entry with the DMG + SHA256SUMS.txt attached.
#
# Notes:
# - The build is UNSIGNED. macOS users hit Gatekeeper on first launch;
#   the bypass is documented in README.md.

name: Release

on:
  push:
    tags:
      - 'v*'

# If someone force-pushes the same tag to fix a typo before the first
# build finishes, cancel the older run rather than racing two release
# uploads.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Stage 1: create the draft release with CHANGELOG notes ─────────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.notes.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracting CHANGELOG section for [$VERSION]"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for [$VERSION]. Add a '## [$VERSION] - YYYY-MM-DD' entry before tagging."
            exit 1
          fi
          echo "--- Release notes preview ---"
          cat RELEASE_NOTES.md

      - name: Create draft GitHub Release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            const tag = context.ref.replace('refs/tags/', '');
            // Semver prerelease tags always contain a `-` (v0.3.0-rc1,
            // v0.3.0-beta.2, etc.). Flag those as GitHub pre-releases
            // so they don't show as "Latest" on the Releases page.
            const isPrerelease = tag.includes('-');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Ekorbia ${tag}`,
              body,
              draft: true,
              prerelease: isPrerelease,
            });
            return data.id;
          result-encoding: string

  # ── Stage 2: build on macOS, upload the bundle to the draft ────────────
  build:
    name: Build (macOS)
    needs: create-release
    permissions:
      contents: write
    # aarch64-apple-darwin native — the release targets Apple-Silicon Macs.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Build the bundled engine sidecar (static llama-server from a
      # PINNED llama.cpp source release) BEFORE `cargo tauri build` —
      # tauri.macos.conf.json's externalBin requires the file and the
      # bundler copies it into Ekorbia.app/Contents/MacOS/. End users get
      # it inside the DMG; nobody builds anything client-side. Adds ~10
      # min (cmake is preinstalled on the hosted macOS runners; the script
      # sha256-pins its source and refuses binaries linking non-system
      # libraries).
      - name: Build engine sidecar (llama-server)
        run: ./scripts/fetch-llama-server.sh

      # tauri-action runs `cargo tauri build`, finds the bundle outputs,
      # and uploads them to the release identified by `releaseId`.
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # ── Stage 3: SHA256SUMS + flip draft to published ──────────────────────
  publish-release:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}"
          ls -la

      - name: Compute SHA256SUMS
        run: |
          cd assets
          # Hash everything except a pre-existing sums file (paranoia —
          # the draft shouldn't have one yet).
          sha256sum * | grep -v 'SHA256SUMS.txt$' > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release upload "${{ github.ref_name }}" SHA256SUMS.txt \
            --clobber --repo "${{ github.repository }}"

      - name: Flip draft to published
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
